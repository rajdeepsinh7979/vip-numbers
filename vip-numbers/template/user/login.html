<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to your Bhudev Sim Store account to access premium VIP mobile numbers.">
    <title>Login — Bhudev Sim Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <style>
        /* ============================================
           BHUDEV SIM STORE — LOGIN PAGE
           Dark Premium Theme — Glassmorphism Container
           ============================================ */

        :root {
            --black: #0B0B0B;
            --charcoal: #161616;
            --dark-gray: #222222;
            --mid-gray: #2A2A2A;
            --light-gray: #333333;
            --surface-gray: #3D3D3D;
            --gold: #D4AF37;
            --gold-light: #E8C547;
            --gold-pale: #F5E8A8;
            --gold-dark: #8B7536;
            --gold-muted: rgba(212, 175, 55, 0.12);
            --gold-border: rgba(212, 175, 55, 0.08);
            --gold-border-hover: rgba(212, 175, 55, 0.25);
            --text-primary: #E8E8E8;
            --text-secondary: #999999;
            --text-muted: #666666;
            --text-dim: #444444;
            --danger: #E5484D;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-full: 9999px;

            --shadow-gold: 0 20px 50px -15px rgba(212, 175, 55, 0.1);

            --transition-fast: 0.2s ease;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);

            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-accent: 'Poppins', sans-serif;

            --container-max: 1440px;
            --container-padding: clamp(16px, 4vw, 48px);
        }

        /* Remove blue tap highlight and default outlines */
        *, *::before, *::after { 
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }
        :focus { outline: none; }
        :focus-visible {
            outline: 2px solid var(--gold-border-hover);
            outline-offset: 2px;
            border-radius: var(--radius-sm);
        }

        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-primary);
            background: var(--black);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            min-height: 100vh;
        }
        a { color: inherit; text-decoration: none; transition: color var(--transition-fast); }
        ul, ol { list-style: none; }
        img { max-width: 100%; display: block; height: auto; }
        button, input, select, textarea { font: inherit; color: inherit; border: none; outline: none; background: none; }
        button { cursor: pointer; }

        .container {
            width: 100%; max-width: var(--container-max);
            margin: 0 auto;
            padding-left: var(--container-padding);
            padding-right: var(--container-padding);
        }

        .gold-text {
            background: linear-gradient(135deg, #D4AF37 0%, #F5E8A8 45%, #D4AF37 65%, #8B7536 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .gold-shimmer {
            background: linear-gradient(110deg, #D4AF37 0%, #F5E8A8 28%, #D4AF37 52%, #F0D97A 78%, #D4AF37 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            animation: shimmer 4s ease-in-out infinite;
        }
        @keyframes shimmer { 0%, 100% { background-position: 0% center; } 50% { background-position: 200% center; } }
        @keyframes particleFloat {
            0% { transform: translateY(0) scale(0); opacity: 0; }
            8% { opacity: 0.6; transform: translateY(0) scale(1); }
            90% { opacity: 0.2; }
            100% { transform: translateY(-100vh) scale(0.3); opacity: 0; }
        }
        @keyframes glow-breathe {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        @keyframes rotate-border {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- Buttons ---------- */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            font-family: var(--font-accent); font-weight: 600; font-size: 14px;
            border-radius: var(--radius-md); padding: 12px 24px;
            transition: all var(--transition); white-space: nowrap; line-height: 1;
        }
        .btn--lg { font-size: 15px; padding: 16px 32px; border-radius: var(--radius-lg); }
        .btn--flex { flex: 1; width: 100%; }
        .btn--gold {
            background: linear-gradient(135deg, #D4AF37 0%, #E8C547 50%, #D4AF37 100%);
            background-size: 200% 200%; color: var(--black);
        }
        .btn--gold:hover { background-position: 100% 100%; box-shadow: 0 8px 30px rgba(212, 175, 55, 0.25); transform: translateY(-1px); }

        /* ==========================================
           LOGIN HERO (Background Stage)
           ========================================== */
        .login-hero {
            position: relative;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: var(--black);
            padding: 20px; /* Spacing around the glass container */
        }
        .login-hero::before {
            content: '';
            position: absolute;
            top: 10%; left: 20%;
            width: 40%; height: 80%;
            background: radial-gradient(ellipse, rgba(212, 175, 55, 0.04) 0%, transparent 70%);
            pointer-events: none;
        }
        .login-hero::after {
            content: '';
            position: absolute;
            bottom: 5%; right: 10%;
            width: 35%; height: 60%;
            background: radial-gradient(ellipse, rgba(212, 175, 55, 0.03) 0%, transparent 70%);
            pointer-events: none;
        }
        .hero__particle {
            position: absolute; bottom: -10px; left: var(--x);
            width: var(--s); height: var(--s);
            background: rgba(212, 175, 55, 0.35); border-radius: 50%;
            animation: particleFloat var(--dur) var(--d) linear infinite;
        }
        .hero__grid-pattern {
            position: absolute; inset: 0; pointer-events: none;
            background-image: linear-gradient(rgba(212, 175, 55, 0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(212, 175, 55, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
        }
        .hero__bg { position: absolute; inset: 0; pointer-events: none; }

        /* Geometric decorations */
        .login-hero__geo {
            position: absolute; pointer-events: none;
            border: 1px solid rgba(212, 175, 55, 0.04); border-radius: 50%;
        }
        .login-hero__geo--1 { width: 400px; height: 400px; top: -100px; right: -80px; }
        .login-hero__geo--2 { width: 250px; height: 250px; bottom: -60px; left: -40px; }
        .login-hero__geo--3 {
            width: 150px; height: 150px; top: 30%; right: 35%;
            border-radius: var(--radius-lg); transform: rotate(45deg);
        }

        /* ==========================================
           GLASSMORPHISM CONTAINER (New)
           ========================================== */
        .login-glass-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1040px;
            background: rgba(15, 15, 15, 0.55); /* Dark transparent glass */
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 24px; /* Premium rounded corners */
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: clamp(24px, 5vw, 48px); /* Comfortable responsive padding */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Subtle inner glow for the glass container */
        .login-glass-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 24px;
            background: radial-gradient(circle at top left, rgba(212, 175, 55, 0.05), transparent 60%);
            pointer-events: none;
        }

        /* Two column grid inside glass container */
        .login-hero__inner {
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
            align-items: center;
            position: relative;
            z-index: 2;
            width: 100%;
        }

        /* ---- Left Column: Logo Showcase ---- */
        .login-hero__logo-col { display: flex; justify-content: center; align-items: center; min-width: 0; }
        .login-hero__logo-card {
            position: relative;
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1 / 1;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
        }
        .login-hero__logo-glow {
            position: absolute; inset: -20px; border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 65%);
            animation: glow-breathe 5s ease-in-out infinite;
        }
        .login-hero__logo-border {
            position: absolute; inset: 0; border-radius: 50%;
            border: 2px solid transparent;
            background: conic-gradient(from 0deg, var(--gold-dark), transparent 40%, transparent 60%, var(--gold-dark)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            animation: rotate-border 8s linear infinite;
        }
        .login-hero__logo-content {
            position: relative; z-index: 2;
            width: 88%; height: 88%; border-radius: 50%;
            background: linear-gradient(145deg, var(--charcoal), var(--dark-gray));
            border: 1px solid var(--gold-border);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 16px;
            box-shadow: inset 0 2px 20px rgba(0, 0, 0, 0.3), 0 0 60px rgba(212, 175, 55, 0.06);
            padding: 24px;
            text-align: center;
        }
        .login-hero__logo-img { max-width: 60%; max-height: 50%; object-fit: contain; }
        .login-hero__logo-text { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .login-hero__logo-name {
            font-family: var(--font-heading); font-weight: 800;
            font-size: 22px; color: var(--text-primary); letter-spacing: 0.01em;
        }
        .login-hero__logo-tagline {
            font-family: var(--font-accent); font-size: 10px; font-weight: 600;
            color: var(--gold); text-transform: uppercase; letter-spacing: 0.2em;
        }

        /* ---- Right Column: Login Form ---- */
        .login-hero__form-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

        .login-hero__label {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 7px 18px; border-radius: var(--radius-full);
            border: 1px solid var(--gold-border-hover);
            background: rgba(212, 175, 55, 0.05);
            font-family: var(--font-accent); font-size: 11px; font-weight: 600;
            color: var(--gold); letter-spacing: 0.12em; text-transform: uppercase;
            margin-bottom: 20px; width: fit-content;
        }
        .login-hero__title {
            font-family: var(--font-heading); font-weight: 800;
            font-size: clamp(28px, 4.5vw, 40px); line-height: 1.15;
            letter-spacing: -0.02em; color: var(--text-primary); margin-bottom: 12px;
        }
        .login-hero__subtitle {
            font-size: 15px; color: var(--text-muted); line-height: 1.7;
            max-width: 460px; margin-bottom: 28px;
        }

        /* ---------- Login Card (Inner Form Area) ---------- */
        /* Made transparent to blend perfectly inside the glass container */
        .login-card {
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            max-width: 100%;
        }

        /* ---------- Form Fields ---------- */
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: flex; align-items: center; gap: 6px;
            font-family: var(--font-accent); font-size: 13px; font-weight: 500;
            color: var(--text-secondary); margin-bottom: 10px; letter-spacing: 0.01em;
        }
        .form-label .iconify { font-size: 16px; color: var(--gold); }

        .input-wrap {
            position: relative;
            display: flex; align-items: center;
            background: rgba(0, 0, 0, 0.3); /* Slightly darker for contrast against glass */
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
        }
        .input-wrap:focus-within {
            border-color: var(--gold-border-hover);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.06);
        }
        .input-wrap__icon {
            display: flex; align-items: center; justify-content: center;
            padding: 0 14px; color: var(--text-muted); font-size: 20px;
            flex-shrink: 0;
        }
        .input-wrap--error .input-wrap__icon,
        .input-wrap--error .pwd-toggle { color: var(--danger); }
        .input-wrap--error { border-color: rgba(229, 72, 77, 0.4); }

        .form-input {
            flex: 1;
            padding: 14px 14px 14px 0;
            font-size: 14px;
            color: var(--text-primary);
            background: transparent;
            border: none; outline: none;
            min-width: 0;
        }
        .form-input::placeholder { color: var(--text-dim); }

        /* Hide browser default password reveal & clear buttons */
        input::-ms-reveal,
        input::-ms-clear {
            display: none;
        }

        /* Password toggle button */
        .pwd-toggle {
            display: flex; align-items: center; justify-content: center;
            padding: 0 14px; color: var(--text-muted); font-size: 20px;
            flex-shrink: 0; transition: color var(--transition-fast);
            height: 100%;
        }
        .pwd-toggle:hover { color: var(--gold); }

        .form-error {
            display: none; align-items: center; gap: 6px;
            margin-top: 8px; font-size: 12px; color: var(--danger);
        }
        .form-error .iconify { font-size: 14px; }
        .form-error.is-visible { display: flex; }

        /* ---------- Row: Forgot Password ---------- */
        .form-row {
            display: flex; align-items: center; justify-content: flex-end;
            gap: 12px; margin-bottom: 24px; flex-wrap: wrap;
        }
        .forgot-link {
            font-size: 13px; color: var(--gold); font-weight: 500;
            transition: color var(--transition-fast);
        }
        .forgot-link:hover { color: var(--gold-light); text-decoration: underline; }

        /* ---------- Sign up link ---------- */
        .signup-text {
            text-align: center; font-size: 14px; color: var(--text-muted);
            margin-top: 24px;
        }
        .signup-text a { color: var(--gold); font-weight: 600; }
        .signup-text a:hover { text-decoration: underline; }

        /* ---------- Back to home ---------- */
        .back-home {
            display: inline-flex; align-items: center; gap: 6px;
            margin-top: 24px; font-size: 13px; color: var(--text-secondary);
            transition: color var(--transition-fast);
            width: fit-content;
        }
        .back-home:hover { color: var(--gold); }
        .back-home .iconify { font-size: 16px; }

        /* ---------- Scrollbar ---------- */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--black); }
        ::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

        /* ============================================
           RESPONSIVE BREAKPOINTS
           ============================================ */
        @media (min-width: 640px) {
            .login-hero__inner { gap: 40px; }
            .login-hero__logo-card { max-width: 280px; }
            .login-hero__logo-name { font-size: 20px; }
        }

        @media (min-width: 1024px) {
            .login-glass-container {
                padding: 48px;
            }
            .login-hero__inner {
                grid-template-columns: 2fr 3fr; 
                gap: 48px;
            }
            .login-hero__logo-col { justify-content: flex-end; }
            .login-hero__logo-card { max-width: 340px; }
            .login-hero__logo-name { font-size: 24px; }
            .login-hero__title { font-size: 40px; }
        }

        @media (min-width: 1280px) {
            .login-glass-container {
                max-width: 1160px;
                padding: 56px;
            }
            .login-hero__inner { gap: 64px; }
            .login-hero__logo-card { max-width: 360px; }
            .login-hero__logo-name { font-size: 26px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- ========== LOGIN HERO (Background Stage) ========== -->
    <section class="login-hero">
        <div class="hero__bg">
            <span class="hero__particle" style="--x:6%;--d:0s;--dur:13s;--s:2px;"></span>
            <span class="hero__particle" style="--x:22%;--d:2.5s;--dur:15s;--s:2.5px;"></span>
            <span class="hero__particle" style="--x:45%;--d:4s;--dur:11s;--s:2px;"></span>
            <span class="hero__particle" style="--x:65%;--d:1.5s;--dur:14s;--s:3px;"></span>
            <span class="hero__particle" style="--x:82%;--d:3.5s;--dur:12s;--s:2px;"></span>
            <span class="hero__particle" style="--x:94%;--d:5.5s;--dur:16s;--s:2.5px;"></span>
        </div>
        <div class="hero__grid-pattern"></div>

        <!-- Geometric decorations visible around the container -->
        <div class="login-hero__geo login-hero__geo--1" aria-hidden="true"></div>
        <div class="login-hero__geo login-hero__geo--2" aria-hidden="true"></div>
        <div class="login-hero__geo login-hero__geo--3" aria-hidden="true"></div>

        <!-- ========== GLASSMORPHISM CONTAINER ========== -->
        <div class="login-glass-container">
            <div class="login-hero__inner">

                <!-- LEFT: Logo Showcase -->
                <div class="login-hero__logo-col">
                    <div class="login-hero__logo-card">
                        <div class="login-hero__logo-glow"></div>
                        <div class="login-hero__logo-border"></div>
                        <div class="login-hero__logo-content">
                            <img src="logo.png" alt="Bhudev Sim Store" class="login-hero__logo-img" onerror="this.style.display='none'">
                            <div class="login-hero__logo-text">
                                <span class="login-hero__logo-name">Bhudev <span class="gold-text">Sim Store</span></span>
                                <span class="login-hero__logo-tagline">Premium VIP Numbers</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- RIGHT: Login Form -->
                <div class="login-hero__form-col">
                    <span class="login-hero__label">
                        <span class="iconify" data-icon="mdi:lock-open"></span>
                        Welcome Back
                    </span>
                    <h1 class="login-hero__title">
                        Sign in to your <span class="gold-shimmer">Account</span>
                    </h1>
                    <p class="login-hero__subtitle">
                        Login to access your dashboard, track orders, and manage your premium VIP mobile number collection.
                    </p>

                    <!-- Login Form (Transparent inside the glass container) -->
                    <form class="login-card" id="loginForm" novalidate>

                        <!-- Email / Phone -->
                        <div class="form-group">
                            <label class="form-label" for="loginIdentifier">
                                <span class="iconify" data-icon="mdi:account-outline"></span>
                                Email or Mobile Number
                            </label>
                            <div class="input-wrap" id="identifierWrap">
                                <span class="input-wrap__icon">
                                    <span class="iconify" data-icon="mdi:account-circle-outline"></span>
                                </span>
                                <input
                                    type="text"
                                    id="loginIdentifier"
                                    name="identifier"
                                    class="form-input"
                                    placeholder="you@example.com or +91 98765 43210"
                                    autocomplete="username"
                                    required
                                >
                            </div>
                            <div class="form-error" id="identifierError">
                                <span class="iconify" data-icon="mdi:alert-circle-outline"></span>
                                <span>Please enter a valid email or mobile number.</span>
                            </div>
                        </div>

                        <!-- Password with show/hide -->
                        <div class="form-group">
                            <label class="form-label" for="loginPassword">
                                <span class="iconify" data-icon="mdi:shield-key-outline"></span>
                                Password
                            </label>
                            <div class="input-wrap" id="passwordWrap">
                                <span class="input-wrap__icon">
                                    <span class="iconify" data-icon="mdi:lock-outline"></span>
                                </span>
                                <input
                                    type="password"
                                    id="loginPassword"
                                    name="password"
                                    class="form-input"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required
                                >
                                <button
                                    type="button"
                                    class="pwd-toggle"
                                    id="pwdToggle"
                                    aria-label="Show password"
                                    aria-pressed="false"
                                >
                                    <span class="iconify" data-icon="mdi:eye-outline" id="pwdToggleIcon"></span>
                                </button>
                            </div>
                            <div class="form-error" id="passwordError">
                                <span class="iconify" data-icon="mdi:alert-circle-outline"></span>
                                <span>Password must be at least 6 characters.</span>
                            </div>
                        </div>

                        <!-- Forgot password link -->
                        <div class="form-row">
                            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn--gold btn--lg btn--flex" id="loginBtn">
                            <span class="iconify" data-icon="mdi:login"></span>
                            Sign In
                        </button>

                    </form>

                    <a href="index.html" class="back-home">
                        <span class="iconify" data-icon="mdi:arrow-left"></span>
                        Back to home
                    </a>
                </div>

            </div>
        </div>
    </section>

    <script>
        /* ============================================
           PASSWORD SHOW / HIDE TOGGLE
           ============================================ */
        const pwdInput   = document.getElementById('loginPassword');
        const pwdToggle  = document.getElementById('pwdToggle');
        const pwdIcon    = document.getElementById('pwdToggleIcon');

        pwdToggle.addEventListener('click', () => {
            const isHidden = pwdInput.type === 'password';
            pwdInput.type = isHidden ? 'text' : 'password';
            pwdToggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
            pwdToggle.setAttribute('aria-pressed', String(isHidden));
            pwdIcon.setAttribute('data-icon', isHidden ? 'mdi:eye-off-outline' : 'mdi:eye-outline');
        });

        /* ============================================
           FORM VALIDATION + SUBMIT (Clean JS)
           ============================================ */
        const form              = document.getElementById('loginForm');
        const identifier        = document.getElementById('loginIdentifier');
        const password          = document.getElementById('loginPassword');
        const identifierWrap    = document.getElementById('identifierWrap');
        const passwordWrap      = document.getElementById('passwordWrap');
        const identifierError   = document.getElementById('identifierError');
        const passwordError     = document.getElementById('passwordError');
        const loginBtn          = document.getElementById('loginBtn');

        function clearErrors() {
            identifierError.classList.remove('is-visible');
            passwordError.classList.remove('is-visible');
            identifierWrap.classList.remove('input-wrap--error');
            passwordWrap.classList.remove('input-wrap--error');
        }

        identifier.addEventListener('input', clearErrors);
        password.addEventListener('input', clearErrors);

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            clearErrors();

            let valid = true;
            const idVal    = identifier.value.trim();
            const pwdVal   = password.value;

            // Validate identifier (email or 10-digit mobile)
            const emailRe  = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const phoneRe  = /^(\+?91)?[\s-]?[6-9]\d{9}$/;
            if (!idVal || (!emailRe.test(idVal) && !phoneRe.test(idVal))) {
                identifierError.classList.add('is-visible');
                identifierWrap.classList.add('input-wrap--error');
                valid = false;
            }

            // Validate password
            if (!pwdVal || pwdVal.length < 6) {
                passwordError.classList.add('is-visible');
                passwordWrap.classList.add('input-wrap--error');
                valid = false;
            }

            if (valid) {
                // Simulated login success
                const originalHTML = loginBtn.innerHTML;
                loginBtn.innerHTML = '<span class="iconify" data-icon="mdi:loading" style="animation: spin 1s linear infinite;"></span> Signing in...';
                loginBtn.disabled = true;

                setTimeout(() => {
                    alert('Logged in successfully! (Demo)');
                    loginBtn.innerHTML = originalHTML;
                    loginBtn.disabled = false;
                    // window.location.href = 'dashboard.html';
                }, 1400);
            }
        });
    </script>
</body>
</html>
